# DonutTools Konfiguration

drill:
  # Drill baut nur Blöcke ab, für die eine Spitzhacke das richtige Werkzeug ist
  only-preferred-tool: true
  durability-per-block: 1

tree-axe:
  max-logs: 300
  # Nur "echte" Bäume fällen (mit natürlichen Blättern), keine gebauten Holzhäuser
  require-leaves: true
  break-leaves: false
  durability-per-log: 1

timed-pickaxe:
  days: 5

sell-axe:
  cooldown-ms: 500

orders:
  max-price-each: 1000000.0
  max-amount: 100000

