name: Build DonutTools

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Projektstruktur herstellen
        run: |
          mkdir -p src/main/java/de/donuttools src/main/resources
          mv *.java src/main/java/de/donuttools/
          mv plugin.yml config.yml src/main/resources/

      - name: JAR bauen
        run: mvn -B clean package

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DonutTools
          path: target/DonutTools.jar
